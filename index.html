<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>奶娃快跑 · 联机</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#1a2a1a;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    position:fixed; inset:0; }
  #game { position:fixed; inset:0; width:100%; height:100%; overflow:hidden;
    background:radial-gradient(circle at 50% 50%, #4a7a4a 0%, #2a4a2a 100%);
    touch-action:none; }
  #road { position:absolute; left:12%; top:0; width:76%; height:100%;
    background:linear-gradient(#5A5A5A 0%, #3A3A3A 50%, #2E2E2E 100%);
    box-shadow:inset 0 0 80px rgba(0,0,0,.8); }
  #road::before, #road::after { content:""; position:absolute; top:0; height:100%; width:20%;
    background:linear-gradient(180deg, #4a7a4a, #2a4a2a); }
  #road::before { left:-20%; }
  #road::after  { right:-20%; }
  .lane-line { position:absolute; top:0; height:100%; width:4px;
    background:repeating-linear-gradient(180deg, #FFD93D 0 40px, transparent 40px 80px);
    opacity:.9; }
  .lane-line:nth-child(1){ left:33.3%; }
  .lane-line:nth-child(2){ left:66.6%; }
  #world { position:absolute; left:12%; top:0; width:76%; height:100%; pointer-events:none; overflow:hidden; }
  .obj { position:absolute; left:0; top:0; line-height:1; text-shadow:0 4px 10px rgba(0,0,0,.6);
    will-change:transform; }
  .coin-obj { filter:drop-shadow(0 0 10px gold); }
  .player { position:absolute; bottom:10%; width:76px; height:76px; z-index:10;
    left:0; top:auto;
    filter:drop-shadow(0 8px 14px rgba(0,0,0,.5));
    will-change:transform;
    transition:transform .12s ease;
    animation:runBob 0.4s ease-in-out infinite alternate; }
  @keyframes runBob { 0% { transform:translate3d(var(--px),0,0) translateY(0); }
    100% { transform:translate3d(var(--px),0,0) translateY(-6px); } }
  .player.jump { animation:jumpAnim .45s ease; }
  @keyframes jumpAnim { 0% { transform:translate3d(var(--px),0,0) scale(1); }
    40% { transform:translate3d(var(--px),-30px,0) scale(1.2); }
    100% { transform:translate3d(var(--px),0,0) scale(1); } }
  .tag { position:absolute; top:-22px; left:50%; transform:translateX(-50%);
    font-size:13px; font-weight:800; color:#fff; text-shadow:0 2px 4px rgba(0,0,0,.8); white-space:nowrap; }
  #hud {
    position:absolute; top:12px; left:12px; right:12px;
    display:flex; justify-content:space-between; align-items:center;
    color:#fff; font-weight:800; text-shadow:0 3px 8px rgba(0,0,0,.9);
    z-index:20; pointer-events:none; gap:8px;
  }
  .hud-dist { background:rgba(0,0,0,.45); border-radius:12px; padding:8px 14px; font-size:16px; }
  .hud-coins { display:flex; gap:8px; }
  .coin-box { background:rgba(0,0,0,.45); border-radius:12px; padding:8px 12px;
    font-size:14px; line-height:1.3; text-align:center; }
  .coin-box.me { border:2px solid #FFD93D; }
  #status { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    color:#fff; font-size:20px; font-weight:700; text-shadow:0 3px 8px rgba(0,0,0,.9);
    z-index:25; text-align:center; line-height:1.6; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:rgba(0,0,0,.78);
    color:#fff; z-index:30; text-align:center; padding:24px; }
  #overlay h1 { font-size:30px; margin-bottom:16px; }
  #overlay .results { font-size:16px; line-height:2; opacity:.95; margin-bottom:24px; }
  #overlay .results .who { color:#FFD93D; font-weight:900; }
  #overlay button { padding:14px 44px; font-size:20px; font-weight:700; border:none;
    border-radius:50px; background:#FFD93D; color:#333; box-shadow:0 6px 0 #D4A800; cursor:pointer; }
  #overlay button:active { transform:translateY(4px); box-shadow:0 2px 0 #D4A800; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="game">
  <div id="road"><div class="lane-line"></div><div class="lane-line"></div></div>
  <div id="world"></div>

  <div id="player1" class="player"><div class="tag">🟡</div>
    <svg viewBox="0 0 100 100" width="100%" height="100%">
      <ellipse cx="50" cy="90" rx="30" ry="6" fill="rgba(0,0,0,0.2)"/>
      <ellipse cx="50" cy="55" rx="45" ry="40" fill="url(#g1)"/>
      <ellipse cx="35" cy="35" rx="22" ry="16" fill="rgba(255,255,255,0.4)" transform="rotate(-30 35 35)"/>
      <ellipse cx="22" cy="85" rx="10" ry="8" fill="#F5B800" /><ellipse cx="78" cy="85" rx="10" ry="8" fill="#F5B800" />
      <circle cx="32" cy="45" r="16" fill="#D4DFC0"/><circle cx="32" cy="45" r="11" fill="#8E9C7A"/>
      <circle cx="32" cy="45" r="7" fill="#111"/><circle cx="29" cy="42" r="2.5" fill="#FFF"/>
      <circle cx="68" cy="45" r="16" fill="#D4DFC0"/><circle cx="68" cy="45" r="11" fill="#8E9C7A"/>
      <circle cx="68" cy="45" r="7" fill="#111"/><circle cx="65" cy="42" r="2.5" fill="#FFF"/>
      <path d="M 38 70 Q 50 76 62 70" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <defs><radialGradient id="g1" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#FFF59D"/><stop offset="50%" stop-color="#FFD93D"/><stop offset="100%" stop-color="#E6A800"/>
      </radialGradient></defs>
    </svg>
  </div>
  <div id="player2" class="player"><div class="tag">🔵</div>
    <svg viewBox="0 0 100 100" width="100%" height="100%">
      <ellipse cx="50" cy="90" rx="30" ry="6" fill="rgba(0,0,0,0.2)"/>
      <ellipse cx="50" cy="55" rx="45" ry="40" fill="url(#g2)"/>
      <ellipse cx="35" cy="35" rx="22" ry="16" fill="rgba(255,255,255,0.4)" transform="rotate(-30 35 35)"/>
      <ellipse cx="22" cy="85" rx="10" ry="8" fill="#3A7BC8" /><ellipse cx="78" cy="85" rx="10" ry="8" fill="#3A7BC8" />
      <circle cx="32" cy="45" r="16" fill="#C8D9F0"/><circle cx="32" cy="45" r="11" fill="#6A88B0"/>
      <circle cx="32" cy="45" r="7" fill="#111"/><circle cx="29" cy="42" r="2.5" fill="#FFF"/>
      <circle cx="68" cy="45" r="16" fill="#C8D9F0"/><circle cx="68" cy="45" r="11" fill="#6A88B0"/>
      <circle cx="68" cy="45" r="7" fill="#111"/><circle cx="65" cy="42" r="2.5" fill="#FFF"/>
      <path d="M 38 70 Q 50 76 62 70" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <defs><radialGradient id="g2" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#B8D4FF"/><stop offset="50%" stop-color="#5B9BE6"/><stop offset="100%" stop-color="#2E6BB8"/>
      </radialGradient></defs>
    </svg>
  </div>

  <div id="hud">
    <div class="hud-dist">🏃 <span id="dist">0</span> m</div>
    <div class="hud-coins">
      <div class="coin-box" id="coinOther">对方<br>💰 0</div>
      <div class="coin-box me" id="coinMe">你<br>💰 0</div>
    </div>
  </div>

  <div id="status">正在连接服务器...</div>

  <div id="overlay" class="hidden">
    <h1>🐸 奶娃快跑 · 联机</h1>
    <p id="overlayMsg">等待匹配中...</p>
    <button id="startBtn" class="hidden">开始游戏</button>
  </div>
</div>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
(function(){
  const game = document.getElementById('game');
  const world = document.getElementById('world');
  const yellowEl = document.getElementById('player1');
  const blueEl = document.getElementById('player2');
  const distEl = document.getElementById('dist');
  const coinOther = document.getElementById('coinOther');
  const coinMe = document.getElementById('coinMe');
  const overlay = document.getElementById('overlay');
  const overlayMsg = document.getElementById('overlayMsg');
  const startBtn = document.getElementById('startBtn');
  const statusEl = document.getElementById('status');

  let W = game.clientWidth, H = game.clientHeight;
  let laneW = 0;
  let mySlot = -1;
  let myLane = 1, myJumping = false;
  let running = false;

  const objEls = {};
  const socket = io();

  function resize(){ W = game.clientWidth; H = game.clientHeight; laneW = (W*0.76)/3; }
  window.addEventListener('resize', resize);
  function laneCenterX(l){ return laneW*l + laneW/2; }

  function myEl(){ return mySlot === 0 ? yellowEl : blueEl; }
  function partnerEl(){ return mySlot === 0 ? blueEl : yellowEl; }

  function setPlayerPos(el, lane){
    const x = W*0.12 + laneCenterX(lane);
    // 用 CSS 变量 + transform，交给 GPU 渲染
    el.style.setProperty('--px', (x - 38) + 'px');
    el.style.left = '0';
    el.style.transform = 'translate3d(' + (x - 38) + 'px, 0, 0)';
  }

  function renderObjects(objs){
    const seen = {};
    objs.forEach(o => {
      seen[o.id] = true;
      let el = objEls[o.id];
      if(!el){
        el = document.createElement('div');
        el.className = 'obj' + (o.type==='coin'?' coin-obj':'');
        el.textContent = o.emoji || (o.type==='coin' ? '🪙' : '🌵');
        world.appendChild(el);
        objEls[o.id] = el;
      }
      el.style.fontSize = o.w + 'px';
      el.style.width = o.w + 'px';
      // 用 transform 代替 left/top，避免重排
      el.style.transform = 'translate3d(' + (laneCenterX(o.lane) - o.w/2) + 'px,' + o.y + 'px,0)';
    });
    for(const id in objEls){
      if(!seen[id]){ objEls[id].remove(); delete objEls[id]; }
    }
  }

  function updateHud(data){
    if(mySlot < 0) return;
    distEl.textContent = data.distance;
    const me = data.players[mySlot];
    const other = data.players[1 - mySlot];
    const myColor = mySlot === 0 ? '🟡' : '🔵';
    const otherColor = mySlot === 0 ? '🔵' : '🟡';
    coinMe.innerHTML = myColor + ' 你<br>💰 ' + (me?.coins ?? 0);
    coinOther.innerHTML = otherColor + ' 对方<br>💰 ' + (other?.coins ?? 0);
  }

  // 关键优化：不覆盖自己的位置，只同步对方的
  function renderPartner(data){
    if(mySlot < 0) return;
    const other = data.players[1 - mySlot];
    if(other){
      setPlayerPos(partnerEl(), other.lane);
      if(other.jumping) partnerEl().classList.add('jump');
      else partnerEl().classList.remove('jump');
    }
  }

  function checkMyCollision(objs){
    if(!running) return;
    const playerY = H - H*0.10 - 38;
    const py1 = playerY-36, py2 = playerY+36;
    objs.forEach(o => {
      if(o.lane !== myLane) return;
      const oy1 = o.y + o.h*0.15, oy2 = o.y + o.h*0.85;
      if(py1<oy2 && py2>oy1){
        if(o.type==='coin'){
          socket.emit('eat-coin', o.id);
        } else if(!myJumping){
          running = false;
          socket.emit('hit-obstacle');
        }
      }
    });
  }

  socket.on('connect', ()=>socket.emit('join'));

  socket.on('joined', (data)=>{
    mySlot = data.slot;
    myLane = 1;
    statusEl.textContent = '等待匹配...';
    overlay.classList.remove('hidden');
    overlayMsg.textContent = '等待对方加入...';
    setPlayerPos(myEl(), myLane);
  });

  socket.on('waiting', ()=>{
    statusEl.textContent = '等待对方加入...';
    overlayMsg.textContent = '等待对方加入...';
  });

  socket.on('ready', ()=>{
    statusEl.textContent = '匹配成功！';
    overlayMsg.innerHTML = '匹配成功！<br>准备一起跑';
    startBtn.classList.remove('hidden');
    startBtn.textContent = '开始游戏';
  });

  socket.on('state', (data)=>{
    renderObjects(data.objects);
    updateHud(data);
    renderPartner(data);
    checkMyCollision(data.objects);
  });

  socket.on('gameover', (data)=>{
    running = false;
    for(const id in objEls){ objEls[id].remove(); delete objEls[id]; }
    overlay.classList.remove('hidden');
    const iHit = data.byPlayer === mySlot;
    overlay.querySelector('h1').textContent = iHit ? '💥 你撞到啦！' : '💥 对方撞到啦！';
    const yellowLabel = mySlot === 0 ? '你' : '对方';
    const blueLabel = mySlot === 0 ? '对方' : '你';
    overlayMsg.innerHTML =
      '<div class="results">' +
        '<div>一共跑了 <b>' + data.distance + '</b> 米</div>' +
        '<div style="margin-top:10px;">🟡 ' + yellowLabel + '：💰 ' + data.coins[0] + ' 个</div>' +
        '<div>🔵 ' + blueLabel + '：💰 ' + data.coins[1] + ' 个</div>' +
        '<div style="margin-top:14px;font-size:15px;">' +
          '撞到的是：<span class="who">' + (iHit ? '你' : '对方') + '</span>' +
        '</div>' +
      '</div>';
    startBtn.classList.remove('hidden');
    startBtn.textContent = '再来一局';
  });

  socket.on('restart', ()=>{
    for(const id in objEls){ objEls[id].remove(); delete objEls[id]; }
    overlay.classList.add('hidden');
    statusEl.classList.add('hidden');
    running = true;
  });

  socket.on('partner-left', ()=>{
    statusEl.textContent='对方断开了，刷新页面重新匹配';
    statusEl.classList.remove('hidden');
    running = false;
  });

  function jumpMine(){
    if(!running || myJumping) return;
    myJumping = true;
    myEl().classList.add('jump');
    socket.emit('move', { lane: myLane, jumping: true });
    setTimeout(()=>{
      myJumping = false;
      myEl().classList.remove('jump');
      socket.emit('move', { lane: myLane, jumping: false });
    }, 450);
  }

  function moveLane(d){
    if(!running) return;
    if(myLane + d < 0 || myLane + d > 2) return;
    myLane += d;
    setPlayerPos(myEl(), myLane);
    socket.emit('move', { lane: myLane, jumping: myJumping });
  }

  document.addEventListener('keydown', e=>{
    if(!running) return;
    switch(e.key.toLowerCase()){
      case 'a': case 'arrowleft': moveLane(-1); e.preventDefault(); break;
      case 'd': case 'arrowright': moveLane(1); e.preventDefault(); break;
      case 'w': case 'arrowup': jumpMine(); e.preventDefault(); break;
    }
  });

  let sx=0, sy=0, st=0;
  game.addEventListener('touchstart', e=>{ const t=e.changedTouches[0]; sx=t.clientX; sy=t.clientY; st=Date.now(); }, {passive:true});
  game.addEventListener('touchend', e=>{
    const t=e.changedTouches[0];
    const dx=t.clientX-sx, dy=t.clientY-sy, dt=Date.now()-st;
    if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy)){ if(dx>0) moveLane(1); else moveLane(-1); }
    else if(dy<-30||dt<250){ jumpMine(); }
  }, {passive:true});

  function handleStart(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    socket.emit('restart');
    running = true;
    overlay.classList.add('hidden');
  }
  startBtn.addEventListener('click', handleStart);
  startBtn.addEventListener('touchstart', handleStart, {passive:false});

  resize();
})();
</script>
</body>
</html>
